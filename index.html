<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Upload Trap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: #1f2937;
            padding: 35px;
            border-radius: 12px;
            width: 420px;
            margin: auto;
        }

        input {
            margin: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hint {
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📦 The Upload Trap</h1>

    <p>Upload a file to the server.</p>

    <p class="hint">
        The developer says only safe files are allowed...
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <br>

        <button type="submit">Upload File</button>

    </form>

</div>

</body>
</html>
